<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نیک‌زاد | انجمن دانش‌آموزی</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #05472a, #2357c1);
      background-size: 400% 400%;
      animation: bgMove 10s ease infinite;
    }

    @keyframes bgMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .fade-in {
      animation: fadeIn 1.4s ease-in-out both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="min-h-screen text-white flex flex-col justify-between shadow-lg shadow-green-800">
  <header class="text-center py-10">
    <h1 class="text-5xl font-black mb-2">انجمن دانش‌آموزی نیک‌زاد</h1>
    <p class="text-2xl">با ما آینده را بازیافت کن!</p>
  </header>

  <main class="px-4 md:px-16">
    <section id="posts" class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
      <!-- پست‌ها از JSON بارگذاری می‌شوند -->
    </section>
  </main>

  <footer class="mt-10 bg-white text-gray-800 py-6 px-4">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="text-center md:text-right">
        <p class="font-bold">نیک‌زاد | انجمن دانش‌آموزی</p>
        <p class="text-sm">تمامی حقوق محفوظ است © 2025</p>
      </div>
      <div class="flex gap-4 items-center">
        <a href="https://t.me/nikzad_society" target="_blank" class="hover:text-green-700 transition">تلگرام</a>
        <a href="https://instagram.com/nikzad_society" target="_blank" class="hover:text-green-700 transition">اینستاگرام</a>
      </div>
    </div>
  </footer>

  <script>
    fetch('programs.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('posts');
        data.forEach(post => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl shadow-md overflow-hidden text-gray-800 hover:shadow-xl transition';
          card.innerHTML = `
            <div class="p-6">
              <h2 class="text-2xl font-bold fade-in mb-2">${post.title}</h2>
              <p class="text-sm mb-4">${post.description}</p>
              <a href="https://t.me/${post.telegram}" target="_blank" class="text-green-700 font-semibold hover:underline">بیشتر در تلگرام</a>
            </div>
          `;
          container.appendChild(card);
        });
      });
  </script>
</body>

</html>
