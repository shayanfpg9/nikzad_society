<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نیک‌زاد | Nikzad Society</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Vazir', sans-serif;
    }
    .fade-in {
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#f5f5f5] text-[#05472a]">
  <!-- Wrapper -->
  <div class="min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="w-full bg-[#2357c1] text-white rounded-b-3xl p-6 text-center shadow-xl">
      <h1 class="text-3xl md:text-4xl font-bold fade-in">جامعه دانش‌آموزی نیک‌زاد</h1>
      <p class="text-sm md:text-base mt-2 fade-in">ما تغییر را از خودمان آغاز می‌کنیم!</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-6 md:p-12 space-y-8 fade-in">
      <section class="bg-white rounded-3xl p-6 shadow-lg">
        <h2 class="text-2xl font-bold mb-2">هدف ما چیه؟</h2>
        <p>با تفکیک زباله‌ها در مدرسه، کمک می‌کنیم به کودکان نیازمند. شما فقط همکاری کنید، ما بقیه‌ش با ما!</p>
      </section>

      <section class="bg-white rounded-3xl p-6 shadow-lg">
        <h2 class="text-2xl font-bold mb-4">برنامه‌ها</h2>
        <div id="slider" class="space-y-4"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-[#2357c1] text-white text-center rounded-t-3xl p-6">
      <p>ارتباط با ما در تلگرام و اینستاگرام: <br><span class="font-bold">@nikzad_society</span></p>
      <p class="text-sm mt-2">© 2025 Nikzad Society. All rights reserved.</p>
    </footer>
  </div>

  <!-- Sample JSON posts -->
  <script>
    const posts = [
      { title: "پویش کاغذی", desc: "جمع‌آوری کاغذهای باطله برای خرید ویلچر" },
      { title: "تفکیک هوشمند", desc: "سطل‌های مخصوص پلاستیک و فلز در مدرسه" },
      { title: "کمک‌رسانی با بازیافت", desc: "درآمد حاصل از بازیافت برای کودکان کار" }
    ];

    const slider = document.getElementById('slider');
    posts.forEach(post => {
      const div = document.createElement('div');
      div.className = "p-4 bg-[#f5f5f5] rounded-2xl shadow fade-in hover:scale-105 transition-transform";
      div.innerHTML = `<h3 class="text-xl font-semibold">${post.title}</h3><p>${post.desc}</p>`;
      slider.appendChild(div);
    });
  </script>
</body>
</html>
