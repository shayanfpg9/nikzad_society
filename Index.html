<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نیک‌زاد | انجمن دانش‌آموزی</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(to bottom right, #f5f5f5, #d6f5df);
        font-family: 'Vazirmatn', sans-serif;
      }
      .fade {
        animation: fadeIn 1s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="text-gray-800">
    <!-- Header -->
    <header class="bg-green-800 text-white p-5 rounded-b-3xl shadow-xl">
      <div class="container mx-auto flex flex-col sm:flex-row items-center justify-between">
        <h1 class="text-3xl font-bold tracking-wider">نیک‌زاد</h1>
        <nav class="mt-4 sm:mt-0">
          <a href="#programs" class="ml-4 hover:underline">برنامه‌ها</a>
          <a href="#contact" class="hover:underline">ارتباط با ما</a>
        </nav>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="text-center py-20 fade">
      <h2 class="text-4xl sm:text-5xl font-extrabold text-green-900 mb-4">
        تغییر از همین‌جا شروع میشه
      </h2>
      <p class="text-lg sm:text-xl text-green-700 max-w-xl mx-auto">
        با برنامه‌های محیط‌زیستی ما همراه شو، تفکیک کن، بازیافت کن، آینده‌ رو بساز.
      </p>
    </section>

    <!-- Programs Section -->
    <section id="programs" class="bg-white p-10 rounded-t-3xl fade">
      <h3 class="text-2xl font-bold text-green-900 mb-6 text-center">برنامه‌ها</h3>
      <div id="programList" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <!-- Footer -->
    <footer id="contact" class="bg-green-900 text-white text-center py-8 rounded-t-3xl mt-10">
      <p class="text-lg font-semibold mb-2">ارتباط با ما</p>
      <p class="mb-1">تلگرام: <a href="https://t.me/nikzad_society" class="underline">@nikzad_society</a></p>
      <p>اینستاگرام: <a href="https://instagram.com/nikzad_society" class="underline">@nikzad_society</a></p>
      <p class="mt-4 text-sm">© 2025 Nikzad Society | طراحی با عشق و مسئولیت</p>
    </footer>

    <!-- JSON Fetch -->
    <script>
      fetch("programs.json")
        .then((res) => res.json())
        .then((data) => {
          const list = document.getElementById("programList");
          data.forEach((item) => {
            const card = document.createElement("div");
            card.className =
              "p-6 rounded-2xl bg-green-100 shadow-md hover:shadow-xl transition-all";
            card.innerHTML = `
              <h4 class="text-xl font-bold text-green-800 mb-2">${item.title}</h4>
              <p class="text-green-700 mb-4">${item.description}</p>
              <a
                href="https://t.me/${item.telegram}"
                target="_blank"
                class="text-green-900 font-semibold underline"
                >مشاهده در تلگرام</a
              >`;
            list.appendChild(card);
          });
        });
    </script>
  </body>
</html>
