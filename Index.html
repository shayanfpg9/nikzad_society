<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>انجمن نیک‌زاد</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f5f5f5, #e3fcec);
      overflow-x: hidden;
    }
    .fade-in {
      animation: fadeIn 1.4s ease-in-out both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-gray-800">
  <!-- هدر -->
  <header class="w-full py-6 bg-[#05472a] text-white shadow-lg">
    <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold rounded-full px-4 py-1 bg-[#2357c1]">نیک‌زاد</h1>
      <nav class="space-x-4 space-x-reverse">
        <a href="#programs" class="hover:underline">برنامه‌ها</a>
        <a href="#contact" class="hover:underline">ارتباط با ما</a>
      </nav>
    </div>
  </header>

  <!-- معرفی -->
  <section class="w-full py-12 text-center fade-in">
    <h2 class="text-3xl md:text-5xl font-bold text-[#05472a]">تغییری کوچک، تاثیری بزرگ</h2>
    <p class="mt-4 max-w-xl mx-auto text-lg text-[#2357c1]">با نیک‌زاد، زباله‌های بازیافتی تبدیل به امید و حمایت برای دانش‌آموزان می‌شن.</p>
  </section>

  <!-- برنامه‌ها -->
  <section id="programs" class="py-16 bg-[#f5f5f5]">
    <div class="max-w-6xl mx-auto px-4">
      <h3 class="text-2xl font-bold text-center text-[#05472a] mb-10">آخرین برنامه‌ها</h3>
      <div id="program-list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
    </div>
  </section>

  <!-- ارتباط با ما -->
  <footer id="contact" class="bg-[#2357c1] text-white py-10 mt-16">
    <div class="max-w-4xl mx-auto px-4 text-center">
      <h4 class="text-xl font-bold mb-4">راه‌های ارتباطی</h4>
      <p>تلگرام: <a href="https://t.me/nikzad_society" class="underline">@nikzad_society</a></p>
      <p>اینستاگرام: <a href="https://instagram.com/nikzad_society" class="underline">@nikzad_society</a></p>
      <p class="mt-4 text-sm">© 2025 Nikzad Society. All rights reserved.</p>
    </div>
  </footer>

  <!-- اسکریپت برای خواندن JSON -->
  <script>
    fetch('programs.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('program-list');
        data.forEach(item => {
          container.innerHTML += `
            <div class="rounded-2xl bg-white shadow-lg p-6 fade-in">
              <h4 class="text-xl font-bold text-[#05472a] mb-2">${item.title}</h4>
              <p class="text-gray-600 mb-4">${item.description}</p>
              <a href="https://t.me/${item.telegram}" target="_blank" class="text-[#2357c1] font-semibold hover:underline">مشاهده در تلگرام</a>
            </div>
          `;
        });
      });
  </script>
</body>
</html>
